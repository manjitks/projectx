[project]
name = "projectx"
version = "0.1.0"
description = "Modular, provider-agnostic AI platform"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0,<3.0",
    "pydantic-settings>=2.0,<3.0",
    "pyyaml>=6.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "aiofiles>=24.0",
    "aiosqlite>=0.20",
]

[project.optional-dependencies]
api = ["fastapi>=0.115", "uvicorn[standard]>=0.30"]
cli = ["textual>=0.80", "rich>=13.0", "typer>=0.12"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.24", "ruff>=0.6"]
all = ["projectx[api,cli,dev]"]

[project.scripts]
projectx = "projectx.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/projectx"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
